[package]
name = "source2-kv3"
description = "Reader and writer for Valve's KeyValues 3 (KV3): binary v1 to v5 and the original VKV encoding, and text"
keywords = ["source2", "kv3", "keyvalues", "valve", "serialization"]
categories = ["game-development", "parser-implementations", "encoding"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
lz4_flex = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
zstd-rs = { workspace = true, optional = true }

[dev-dependencies]
lz4_flex = { workspace = true, features = ["safe-encode"] }

[features]
default = ["lz4", "zstd"]
lz4 = ["dep:lz4_flex"]
zstd = ["dep:ruzstd", "dep:zstd-rs"]

[lints]
workspace = true
